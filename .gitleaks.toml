# Outsider ASM — gitleaks config. Extends the stock ruleset; add allowlist
# entries below for anything that trips a false positive.
[extend]
useDefault = true

[allowlist]
description = "Project-known false positives"
paths = [
  '''docker/versions\.env''',
  # Generated, reviewed, redacted demo export (public TLS cert material only, no secrets):
  # host names / IPs / emails are pseudonymised; see tools/export_demo_snapshot.py.
  '''frontend/src/demo_snapshot\.json''',
  '''docs/assets/.*''',
]
